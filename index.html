

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catatan Harian</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    background: #f4efff;
    color: #40334f;
    padding: 20px;
}

.container {
    max-width: 900px;
    margin: auto;
}

header {
    background: linear-gradient(135deg,#cbb4f5,#a98be7);
    color: white;
    text-align: center;
    padding: 35px 15px;
    border-radius: 20px;
}

header h1 {
    font-size: 32px;
    margin-bottom: 10px;
}

nav {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px;
    background: white;
    padding: 18px;
    border-radius: 15px;
    margin: 20px 0;
}

nav a {
    text-decoration: none;
    color: #805bb8;
    font-weight: bold;
    padding: 10px 15px;
    border-radius: 9px;
}

nav a:hover {
    background: #eee4ff;
}

section {
    background: white;
    padding: 25px;
    border-radius: 18px;
    margin-bottom: 20px;
    box-shadow: 0 5px 15px #d9c9ef;
    scroll-margin-top: 15px;
}

h2 {
    color: #8864c5;
    margin-bottom: 20px;
}

input, textarea {
    width: 100%;
    padding: 13px;
    margin-bottom: 15px;
    border: 1px solid #d8c8f2;
    border-radius: 10px;
    font-size: 15px;
    outline: none;
}

textarea {
    height: 130px;
    resize: vertical;
}

button {
    padding: 11px 18px;
    border: none;
    border-radius: 9px;
    cursor: pointer;
    margin-right: 5px;
    margin-top: 5px;
}

.simpan {
    background: #a98be7;
    color: white;
}

.edit {
    background: #e6dafa;
    color: #63469c;
}

.hapus {
    background: #f8d9e0;
    color: #a43d58;
}

.catatan {
    background: #faf7ff;
    padding: 18px;
    border-radius: 12px;
    margin-bottom: 15px;
    border-left: 5px solid #b69be9;
}

.catatan h3 {
    color: #7553ae;
    margin-bottom: 8px;
}

.tanggal {
    font-size: 12px;
    color: #999;
    margin-bottom: 10px;
}

.isi {
    white-space: pre-wrap;
    line-height: 1.6;
    margin-bottom: 10px;
}

.kosong {
    text-align: center;
    color: #999;
    padding: 20px;
}

footer {
    text-align: center;
    color: #9b8bad;
    padding: 20px;
}

</style>
</head>

<body>

<div class="container">

<header id="beranda">
    <h1>📖 CATATAN HARIAN</h1>
    <p>Tempat menyimpan cerita dan kenangan setiap hari.</p>
</header>

<nav>
    <a href="#beranda">🏠 Beranda</a>
    <a href="#tambah">✍️ Tambah Catatan</a>
    <a href="#daftar">📚 Daftar Catatan</a>
</nav>

<section id="tambah">
    <h2>✍️ Tulis Catatan Baru</h2>

    <input type="text" id="judul"
    placeholder="Masukkan judul catatan">

    <textarea id="isi"
    placeholder="Tuliskan ceritamu hari ini..."></textarea>

    <button class="simpan" onclick="simpanCatatan()">
        Simpan Catatan
    </button>

    <button class="edit" id="batal"
    onclick="batalEdit()" style="display:none">
        Batal Edit
    </button>
</section>

<section id="daftar">
    <h2>📚 Daftar Catatan</h2>
    <div id="daftarCatatan"></div>
</section>

<footer>
    <p>© 2026 Catatan Harian | Dibuat dengan ❤️</p>
</footer>

</div>

<script>

let catatan = JSON.parse(
    localStorage.getItem("catatanHarian")
) || [];

let editIndex = -1;

function simpanData() {
    localStorage.setItem(
        "catatanHarian",
        JSON.stringify(catatan)
    );
}

function simpanCatatan() {

    let judul = document.getElementById("judul").value.trim();
    let isi = document.getElementById("isi").value.trim();

    if (judul === "" || isi === "") {
        alert("Judul dan isi catatan harus diisi!");
        return;
    }

    if (editIndex === -1) {

        let tanggal = new Date().toLocaleDateString("id-ID", {
            day: "numeric",
            month: "long",
            year: "numeric"
        });

        catatan.unshift({
            judul: judul,
            isi: isi,
            tanggal: tanggal
        });

        alert("Catatan berhasil disimpan!");

    } else {

        catatan[editIndex].judul = judul;
        catatan[editIndex].isi = isi;

        editIndex = -1;

        document.getElementById("batal").style.display = "none";

        alert("Catatan berhasil diperbarui!");
    }

    simpanData();
    kosongkanForm();
    tampilkanCatatan();
}

function tampilkanCatatan() {

    let daftar = document.getElementById("daftarCatatan");

    daftar.innerHTML = "";

    if (catatan.length === 0) {
        daftar.innerHTML =
        '<p class="kosong">Belum ada catatan.</p>';
        return;
    }

    catatan.forEach((data, index) => {

        let kotak = document.createElement("div");
        kotak.className = "catatan";

        let judul = document.createElement("h3");
        judul.textContent = data.judul;

        let tanggal = document.createElement("p");
        tanggal.className = "tanggal";
        tanggal.textContent = data.tanggal;

        let isi = document.createElement("p");
        isi.className = "isi";
        isi.textContent = data.isi;

        let tombolEdit = document.createElement("button");
        tombolEdit.className = "edit";
        tombolEdit.textContent = "Edit";

        tombolEdit.onclick = function() {
            editCatatan(index);
        };

        let tombolHapus = document.createElement("button");
        tombolHapus.className = "hapus";
        tombolHapus.textContent = "Hapus";

        tombolHapus.onclick = function() {
            hapusCatatan(index);
        };

        kotak.append(
            judul,
            tanggal,
            isi,
            tombolEdit,
            tombolHapus
        );

        daftar.appendChild(kotak);
    });
}

function editCatatan(index) {

    document.getElementById("judul").value =
        catatan[index].judul;

    document.getElementById("isi").value =
        catatan[index].isi;

    editIndex = index;

    document.getElementById("batal").style.display =
        "inline-block";

    document.getElementById("tambah").scrollIntoView({
        behavior: "smooth"
    });
}

function hapusCatatan(index) {

    if (confirm("Yakin ingin menghapus catatan ini?")) {

        catatan.splice(index, 1);

        simpanData();
        tampilkanCatatan();

    }
}

function kosongkanForm() {
    document.getElementById("judul").value = "";
    document.getElementById("isi").value = "";
}

function batalEdit() {
    editIndex = -1;
    kosongkanForm();

    document.getElementById("batal").style.display = "none";
}

tampilkanCatatan();

</script>

</body>
</html>
